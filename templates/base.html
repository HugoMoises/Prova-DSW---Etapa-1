{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="cabecalho">
        <div class="conteudo">
            <a class="marca" href="{% url 'index' %}">
                <strong>SGJogos</strong>
                <span>Jogos Interclasses 2026 · IFRN Campus Pau dos Ferros</span>
            </a>
            <nav class="menu">
                <ul>
                    <li><a href="{% url 'index' %}">Equipes</a></li>
                    <li><a href="#">Administração</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer class="rodape">
        <div class="conteudo">
            <p>SGJogos · Desenvolvimento de Sistemas Web</p>
            <p>IFRN Campus Pau dos Ferros · 2026</p>
        </div>
    </footer>
    {% block scripts %}
    {% endblock %}
</body>
</html>
